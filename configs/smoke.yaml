seed: 42
device: auto

data:
  dataset: synthetic
  num_samples: 1600
  seq_len: 30
  num_sensors: 14
  num_clients: 5
  non_iid_alpha: 0.5
  batch_size: 32

model:
  d_model: 64
  nhead: 4
  transformer_layers: 2
  dim_feedforward: 128
  num_experts: 4
  top_k: 2
  twin_latent_dim: 16
  expert_hidden_dim: 128
  adapter_hidden_dim: 32
  dropout: 0.1

training:
  rounds: 3
  local_epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  prox_mu: 0.001
  lambda_dt: 0.10
  lambda_bal: 0.01
  lambda_tgc: 0.01

federated:
  participation_rate: 1.0
